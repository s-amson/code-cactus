<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CODE CACTUS - Games</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌵%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fira+Code:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       CODE CACTUS - GAMES PAGE STYLESHEET (MATCHING INDEX.HTML)
       ========================================================= */
    @property --sky-top    { syntax: '<color>'; inherits: true; initial-value: #4fc3f7; }
    @property --sky-bottom { syntax: '<color>'; inherits: true; initial-value: #8ae6ff; }

    :root {
      --ink: #1b1b1b;
      --sky-top: #4fc3f7;
      --sky-bottom: #8ae6ff;
      --nav-bg: #8ae6ff;
      --nav-text: #1b1b1b;
      --yellow: #ffd400;
      --green: #1fb35a;
      --orange: #f39200;
      --cloud-fill: #ffffff;
      --card-bg: #ffffff;
      --pill-bg: #ffffff;
      --pill-text: #1b1b1b;
      --pink: #ff5fa2;
      --blue: #33b5ff;
      --purple: #7c4dff;
      --teal: #16b4b4;
      --bad: #ff4d6d;
      --nav-h: 64px;
      --bounce: cubic-bezier(.34, 1.56, .64, 1);
      --font-display: "Chewy", "Comic Sans MS", "Chalkboard SE", cursive;
      --font-body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
      --font-mono: "Fira Code", Consolas, monospace;

      --panel-bg: #fffdf7;
      --panel-alt: #fff8dc;
      --panel-text: #1b1b1b;
      --mut: #4a4a4a;
    }

    body.night-mode {
      --sky-top: #0f0c29;
      --sky-bottom: #302b63;
      --nav-bg: #24244e;
      --nav-text: #ffffff;
      --cloud-fill: #3d3b6e;
      --card-bg: #fffdf7;
      --pill-bg: #24244e;
      --pill-text: #ffffff;

      --panel-bg: #26224e;
      --panel-alt: #312b63;
      --panel-text: #ffffff;
      --mut: #d3caff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    input, textarea, pre, code, select { user-select: text; -webkit-user-select: text; }
    [hidden] { display: none !important; }

    html, body {
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--sky-top);
      font-family: var(--font-body);
      color: var(--ink);
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
    }

    button:focus-visible, select:focus-visible {
      outline: 4px dashed var(--yellow);
      outline-offset: 3px;
    }

    .defs { position: absolute; width: 0; height: 0; overflow: hidden; }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
      transition: --sky-top 2.2s ease-in-out, --sky-bottom 2.2s ease-in-out, background 1.1s ease;
    }

    .sunset-glow {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 94, 98, 0.55) 0%, rgba(255, 195, 113, 0.75) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity 1.2s ease-in-out;
    }
    body.twilight-flash .sunset-glow { opacity: 1; }

    .outlined {
      text-shadow:
         .04em 0 0 var(--ink), -.04em 0 0 var(--ink),
         0 .04em 0 var(--ink),  0 -.04em 0 var(--ink),
         .03em .03em 0 var(--ink), -.03em .03em 0 var(--ink),
         .03em -.03em 0 var(--ink), -.03em -.03em 0 var(--ink),
         .07em .08em 0 var(--ink);
    }

    /* =========================================================
       SHARED SKY (Sun, Moon, Stars & Left-to-Right Clouds)
       ========================================================= */
    .sky { position: absolute; inset: 0; z-index: 1; overflow: hidden; }

    .stars-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-25px);
      transition: opacity 2.2s ease-in-out, transform 2.2s ease-in-out;
    }
    body.night-mode .stars-layer {
      opacity: 1;
      transform: translateY(0);
    }
    .star-dot {
      position: absolute;
      color: #ffd400;
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      text-shadow: 0 0 8px rgba(255, 212, 0, 0.8);
      animation: twinkle 2s ease-in-out infinite alternate;
    }
    .shooting-star {
      position: absolute;
      top: 16vh;
      left: 65vw;
      width: 90px;
      height: 4px;
      background: linear-gradient(90deg, #fff, transparent);
      border-radius: 999px;
      transform: rotate(-25deg) scaleX(0);
      opacity: 0;
    }
    body.night-mode .shooting-star {
      animation: shoot 6s ease-in-out 1.2s infinite;
    }
    @keyframes twinkle {
      0% { transform: scale(0.75) rotate(-10deg); opacity: 0.45; }
      100% { transform: scale(1.2) rotate(10deg); opacity: 1; }
    }
    @keyframes shoot {
      0%, 85%, 100% { transform: rotate(-25deg) translateX(0) scaleX(0); opacity: 0; }
      88% { transform: rotate(-25deg) translateX(-40px) scaleX(1); opacity: 1; }
      94% { transform: rotate(-25deg) translateX(-220px) scaleX(0.2); opacity: 0; }
    }

    .sun, .moon {
      position: absolute;
      left: 4vw;
      top: calc(var(--nav-h) + 5vh);
      width: clamp(74px, 11vw, 138px);
      z-index: 2;
      transition: transform 2.2s cubic-bezier(.34, 1.3, .64, 1), opacity 1.8s ease-in-out;
      transform-origin: 45vw 75vh;
    }
    .sun svg, .moon svg { display: block; width: 100%; height: auto; overflow: visible; }
    #sunRays { transform-origin: 60px 60px; animation: spin 24s linear infinite; }
    .sun:hover svg, .moon:hover svg { animation: jelly .6s; }
    .sun.wink svg, .moon.wink svg { animation: sunHop .8s var(--bounce); }

    body.night-mode .sun {
      transform: rotate(110deg) scale(0.4);
      opacity: 0;
      pointer-events: none;
    }
    .moon {
      transform: rotate(-110deg) scale(0.4);
      opacity: 0;
      pointer-events: none;
    }
    body.night-mode .moon {
      transform: rotate(0deg) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sunHop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.25) rotate(-12deg); }
      70%  { transform: scale(.92) rotate(8deg); }
      100% { transform: scale(1) rotate(0); }
    }

    .cloud {
      position: absolute;
      top: var(--top);
      left: -30vw;
      width: max(var(--w), 115px);
      pointer-events: none;
      animation: drift var(--dur) linear var(--delay) infinite;
      z-index: 2;
    }
    .cloud svg { display: block; width: 100%; height: auto; animation: bob 6s ease-in-out infinite alternate; }
    #cloud path.cloud-body { fill: var(--cloud-fill); transition: fill 2.2s ease-in-out; }

    @keyframes drift { to { transform: translateX(175vw); } }
    @keyframes bob   { to { transform: translateY(10px); } }

    /* =========================================================
       MAIN TASKBAR (SAME AS INDEX.HTML, WITH TOPICS BUTTON)
       ========================================================= */
    .nav {
      position: fixed;
      top: 10px; left: 10px; right: 10px;
      height: var(--nav-h);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 14px 0 16px;
      background: var(--nav-bg);
      border: 3px solid var(--ink);
      border-radius: 20px;
      box-shadow: 0 5px 0 rgba(27, 27, 27, .28);
      transition: background 2s ease-in-out;
    }

    .logo { display: flex; align-items: center; gap: 8px; white-space: nowrap; flex-shrink: 0; }
    .logo-icon { font-size: 1.6rem; display: inline-block; }
    .logo-text {
      font-family: var(--font-display);
      font-size: clamp(1.1rem, 2.8vw, 1.75rem);
      color: var(--green);
      letter-spacing: .03em;
    }
    .logo:hover .logo-icon { animation: wiggle .5s; }
    .logo.hop { animation: jelly .6s; }

    @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 2px;
    }
    .nav-right::-webkit-scrollbar { display: none; }

    .nav-link {
      font-weight: 800;
      font-size: 0.98rem;
      color: var(--nav-text);
      padding: 7px 11px;
      border-radius: 999px;
      transition: background .15s, transform .15s var(--bounce), color 1.5s;
      white-space: nowrap;
      flex-shrink: 0;
      min-height: 42px;
    }
    .nav-link:hover {
      background: rgba(255, 255, 255, .45);
      transform: translateY(-2px) rotate(-2deg);
    }
    .nav-link:active {
      transform: translateY(1px) scale(.96);
    }

    .icon-btn {
      width: 40px; height: 40px;
      font-size: 1.2rem;
      border-radius: 50%;
      border: 3px solid var(--ink);
      background: #fff;
      color: var(--ink);
      box-shadow: 0 3px 0 var(--ink);
      transition: transform .15s var(--bounce);
      flex-shrink: 0;
    }
    .icon-btn:hover { transform: scale(1.12) rotate(-6deg); }
    .icon-btn:active { transform: scale(.92); }

    .mode-switch-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-mode {
      font-weight: 900;
      font-size: 0.92rem;
      padding: 7px 14px;
      background: #ffffff;
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform .12s, box-shadow .12s, background .25s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      min-height: 42px;
    }
    .btn-mode:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
    .btn-mode:active, .btn-mode.active-mode {
      background: var(--yellow);
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .btn-small {
      font-weight: 900;
      font-size: 0.92rem;
      padding: 7px 14px;
      background: var(--pink);
      color: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform .12s, box-shadow .12s;
      white-space: nowrap;
      display: none;
      flex-shrink: 0;
      min-height: 42px;
    }
    .btn-small.visible { display: inline-flex; align-items: center; gap: 5px; }
    .btn-small:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
    .btn-small:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }

    /* =========================================================
       FULL-SCREEN PAGES, BOUNCY LETTERS & BALLOONS
       ========================================================= */
    .page {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
      overscroll-behavior: contain;
    }
    .page.active {
      visibility: visible;
      pointer-events: auto;
    }

    .content {
      position: absolute;
      top: calc(var(--nav-h) + 10px);
      left: 0; right: 0; bottom: 0;
      padding: 2.6vh 5vw 14vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      pointer-events: auto;
      z-index: 4;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .content > * { flex-shrink: 0; }

    .letter { display: inline-block; cursor: pointer; }
    .glyph  { display: inline-block; transform-origin: 50% 80%; }
    .letter:hover .glyph { animation: jelly .6s; }
    .letter.hop .glyph   { animation: hop .6s var(--bounce); }

    @keyframes jelly {
      0%   { transform: scale(1, 1); }
      30%  { transform: scale(1.25, .8); }
      50%  { transform: scale(.85, 1.2) translateY(-6%); }
      70%  { transform: scale(1.1, .95); }
      100% { transform: scale(1, 1); }
    }
    @keyframes hop {
      0%   { transform: translateY(0) rotate(0); }
      40%  { transform: translateY(-28%) rotate(-10deg); }
      100% { transform: translateY(0) rotate(0); }
    }

    .hello {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.5rem, 7.2vw, 5rem);
      line-height: 1.05;
      color: #ffd400;
    }
    .hello-sub {
      font-weight: 900;
      font-size: clamp(0.98rem, 2vw, 1.25rem);
      background: var(--pill-bg);
      color: var(--pill-text);
      border: 3px solid var(--ink);
      border-radius: 20px;
      padding: .45em 1.2em;
      margin: 1.2vh 0 2vh;
      max-width: 780px;
      box-shadow: 0 4px 0 var(--ink);
      transition: background 1.8s ease-in-out, color 1.8s ease-in-out;
    }

    /* Floating Poppable Balloons */
    .balloon {
      position: absolute;
      left: var(--x);
      bottom: -26vh;
      width: 66px; height: 92px;
      z-index: 6;
      animation: rise var(--dur) linear var(--delay) infinite;
    }
    .b-body {
      position: relative;
      display: block;
      width: 100%; height: 100%;
      background: var(--c);
      border: 4px solid var(--ink);
      border-radius: 50% 50% 48% 48% / 56% 56% 44% 44%;
      animation: balloonSway 3s ease-in-out infinite alternate;
      transform-origin: 50% 130%;
    }
    .b-body::before {
      content: ""; position: absolute; left: 14px; top: 12px;
      width: 12px; height: 20px; border-radius: 50%;
      background: rgba(255, 255, 255, .75); transform: rotate(18deg);
    }
    .balloon::after {
      content: ""; position: absolute; left: 50%; top: 100%;
      width: 3px; height: 64px; margin-left: -1px; background: var(--ink);
    }
    .balloon.popped { visibility: hidden; pointer-events: none; }

    @keyframes rise { from { transform: translateY(0); } to { transform: translateY(-150vh); } }
    @keyframes balloonSway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }

    /* =========================================================
       DSA ARCADE FILTER BAR & GAME CARDS (FIXED PICTURES)
       ========================================================= */
    .arcade-toolbar {
      width: 100%;
      max-width: 1120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 2.6vh;
    }

    .filter-label {
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: #ffffff;
      letter-spacing: 0.03em;
    }

    select#filter {
      font-family: var(--font-body);
      font-weight: 900;
      font-size: 1rem;
      background: var(--yellow);
      color: var(--ink);
      border: 3.5px solid var(--ink);
      border-radius: 999px;
      padding: 9px 20px;
      box-shadow: 0 5px 0 var(--ink);
      cursor: pointer;
      transition: transform .15s var(--bounce), box-shadow .15s;
    }
    select#filter:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 var(--ink);
    }
    select#filter option {
      background: #ffffff;
      color: var(--ink);
      font-weight: 800;
    }

    .grid {
      width: 100%;
      max-width: 1120px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding-bottom: 4vh;
    }

    .tile {
      position: relative;
      aspect-ratio: 1.75 / 1.18;
      border-radius: 26px;
      overflow: hidden;
      cursor: pointer;
      border: 4px solid var(--ink);
      padding: 0;
      color: #fff;
      text-align: left;
      box-shadow: 0 8px 0 var(--ink);
      transition: transform .15s var(--bounce), box-shadow .15s;
    }
    @media (hover: hover) {
      .tile:hover {
        transform: translateY(-7px) rotate(-1.2deg);
        box-shadow: 0 14px 0 var(--ink);
      }
      .tile:nth-child(2n):hover {
        transform: translateY(-7px) rotate(1.2deg);
      }
    }
    .tile:active {
      transform: translateY(4px) scale(.98);
      box-shadow: 0 3px 0 var(--ink);
    }

    /* Fixed pictures inside game cards (NO bobbing or movement) */
    .art {
      position: absolute;
      inset: 0 0 22% 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(36px, 4.2vw, 56px);
      letter-spacing: 2px;
      filter: drop-shadow(0 4px 0 rgba(27, 27, 27, 0.45));
      pointer-events: none;
    }
    .art i {
      font-style: normal;
      display: inline-block;
      animation: none !important;
      transform: none !important;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 12px;
      background: #ffffff;
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 0.78rem;
      font-weight: 900;
      box-shadow: 0 3px 0 var(--ink);
      z-index: 2;
    }
    .badge.playable {
      background: var(--yellow);
    }

    .name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 22px 14px 10px;
      background: linear-gradient(transparent, rgba(27, 27, 27, 0.86));
      font-family: var(--font-display);
      font-size: 1.45rem;
      letter-spacing: .03em;
      line-height: 1.05;
      color: #ffffff;
      text-shadow: 0 2px 0 var(--ink);
    }
    .name small {
      display: block;
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 0.82rem;
      opacity: .95;
      margin-top: 3px;
      letter-spacing: 0;
      color: #ffe885;
    }

    /* =========================================================
       COMING SOON MODAL (CODE CACTUS CARTOON STYLE)
       ========================================================= */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 12, 41, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 80;
    }
    .modal.on { display: flex; }

    .box {
      background: var(--card-bg);
      color: var(--ink);
      border: 4px solid var(--ink);
      border-radius: 30px;
      max-width: 430px;
      width: 100%;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 10px 0 var(--ink);
      animation: popIn .45s var(--bounce) both;
    }
    .box .art {
      position: static;
      height: 150px;
      font-size: 68px;
      border-bottom: 4px solid var(--ink);
    }
    .box div.b { padding: 20px 24px 26px; }
    .box h2 {
      margin: 0 0 6px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 2.1rem;
      color: var(--ink);
    }
    .box p {
      color: #4a4a4a;
      font-weight: 800;
      margin: 6px 0;
      font-size: 1.02rem;
    }

    .btn {
      margin-top: 12px;
      font-family: var(--font-display);
      letter-spacing: 0.03em;
      background: var(--yellow);
      color: var(--ink);
      border: 3.5px solid var(--ink);
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 1.15rem;
      box-shadow: 0 5px 0 var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform .15s var(--bounce), box-shadow .15s;
    }
    .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 7px 0 var(--ink); }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }

    /* =========================================================
       PLAYABLE GAME PAGE (#game) - FULL-SCREEN CODE CACTUS VIEW
       ========================================================= */
    .game-shell {
      width: 100%;
      max-width: 1120px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 4vh;
    }

    .gh {
      width: 100%;
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .gh h2 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(1.9rem, 4.5vw, 3.1rem);
      color: var(--yellow);
      margin: 0;
    }
    .gh .btn { margin: 0; background: #ffffff; }
    .gh .btn:hover { background: var(--yellow); }

    .gb {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      width: 100%;
      align-items: stretch;
    }

    .code {
      flex: 1 1 340px;
      background: #191533;
      color: #efe9ff;
      border: 4px solid var(--ink);
      border-radius: 26px;
      padding: 16px;
      font: 600 0.92rem/1.75 var(--font-mono);
      box-shadow: 0 8px 0 var(--ink);
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .ln {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      border-left: 4px solid transparent;
      color: #efe9ff;
      font: inherit;
      white-space: pre;
      padding: 3px 10px;
      border-radius: 8px;
      min-height: 28px;
      overflow-x: auto;
    }
    button.ln { cursor: pointer; }
    button.ln:hover { background: rgba(255, 212, 0, 0.16); }
    .ln.cur {
      background: rgba(255, 212, 0, 0.25);
      border-color: var(--yellow);
      color: #ffffff;

      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 2px solid #3a2680;

      margin: 0;
      padding: 8px 18px;
      font-size: 1.02rem;
    }

    .stage {
      flex: 2 1 440px;
      background: var(--panel-bg);
      color: var(--panel-text);
      border: 4px solid var(--ink);
      border-radius: 26px;
      padding: 20px;
      min-height: 370px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 0 var(--ink);

      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 250px;
      padding: 26px 0;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      padding-bottom: 26px;
    }

    .cell {
      width: 58px;
      height: 64px;
      border: 3.5px solid var(--ink);
      background: #ffffff;
      color: var(--ink);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--ink);
      transition: .3s;

    .cell u {
      position: absolute;
      top: -24px;
      font-size: 0.8rem;
      font-weight: 900;
      color: var(--mut);
      text-decoration: none;
    }
    .cell em {
      position: absolute;
      bottom: -26px;
      font-size: 0.8rem;
      color: var(--pink);
      font-style: normal;
      font-weight: 900;
      white-space: nowrap;

    .hot { box-shadow: 0 0 0 4px var(--yellow), 0 5px 0 var(--ink); }
    .cell.hot { background: var(--yellow); color: var(--ink); }

      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 6px;
      border-bottom: 8px solid #8b5a2b;
      padding: 0 30px 6px;
      margin: auto;

      width: 220px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 3px solid var(--ink);
      background: hsl(var(--h) 75% 48%);
      color: #fff;
      font-weight: 900;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 0 var(--ink);
    }
    .bk em {
      position: absolute;
      left: 100%;
      margin-left: 10px;
      white-space: nowrap;
      color: var(--orange);
      font-style: normal;
      font-weight: 900;

      display: flex;
      flex-direction: column;
      align-items: center;
      font-weight: 900;
      margin: 0 6px;

      font-size: 0.82rem;
      color: var(--pink);
      font-style: normal;
      font-weight: 900;

    .cart {
      background: hsl(var(--h) 75% 48%);
      color: #fff;
      border: 3.5px solid var(--ink);
      border-radius: 14px;
      padding: 8px 14px;
      text-align: center;
      font-weight: 900;
      font-size: 1.15rem;
      min-width: 72px;
      box-shadow: 0 4px 0 var(--ink);

      display: block;
      font-size: 0.78rem;
      font-style: normal;
      color: #ffe36e;

      font-size: 26px;
      font-weight: 900;
      color: var(--panel-text);
    }

      text-align: center;
      color: var(--mut);

      color: var(--panel-text);

      font-weight: 900;
      min-height: 48px;
      box-shadow: 0 4px 0 var(--ink);

      text-align: center;
      min-height: 28px;
      font-weight: 900;
      font-size: 1.05rem;
      color: var(--green);
    }
    body.night-mode .ret { color: var(--yellow); }

    .bars {
      position: relative;
      height: 250px;
      width: 100%;
    }
    .bar {
      position: absolute;
      bottom: 0;
      border-radius: 10px 10px 0 0;
      border: 3px solid var(--ink);
      background: #33b5ff;
      transition: left .5s, height .3s, background .2s;
      text-align: center;
      font-weight: 900;
      color: #fff;
      width: calc(12.5% - 6px);
      margin-left: 3px;
      box-shadow: 0 3px 0 var(--ink);
    }
    .bar.cmp { background: var(--yellow); color: var(--ink); }
    .bar.sw  { background: var(--bad); color: #fff; }
    .bar.ok  { background: #2fc46b; color: #fff; }

    @keyframes stagePop {
      from { transform: translateY(-70px) scale(.3); opacity: 0; }
    }
    .stage-pop { animation: stagePop .5s cubic-bezier(.3, 1.8, .5, 1); }

    @keyframes sh {
      25% { transform: translateX(-12px); }
      75% { transform: translateX(12px); }
    }
    .shake { animation: sh .4s; }

    /* =========================================================
       ENTER / LEAVE PAGE ANIMATIONS & CURTAIN
       ========================================================= */
    .pop { transform-origin: 50% 100%; }
    .page.enter .pop    { animation: popIn .7s var(--bounce) var(--d, 0s) both; }
    .page.enter .letter { animation: dropIn 0.9s ease-out calc(var(--i, 0) * .06s) both; }

    @keyframes popIn {
      0%   { transform: scale(0) rotate(-10deg); opacity: 0; }
      70%  { transform: scale(1.06) rotate(1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes dropIn {
      0%   { transform: translateY(-90vh) rotate(-35deg) scale(.6); opacity: 0; }
      55%  { transform: translateY(2vh) rotate(6deg) scale(1.05); opacity: 1; }
      75%  { transform: translateY(-1vh) rotate(-3deg); opacity: 1; }
      100% { transform: translateY(0) rotate(0); opacity: 1; }
    }

    .page.leaving .pop    { animation: popOut .45s ease-in both; }
    .page.leaving .letter { animation: flyOut .75s cubic-bezier(.5, -.4, .9, .5) calc(var(--i, 0) * .03s) both; }

    @keyframes popOut { to { transform: scale(0) rotate(12deg); opacity: 0; } }
    @keyframes flyOut { to { transform: translate(var(--dx, 0), -130vh) rotate(var(--rot, 180deg)); opacity: 1; } }

    #curtain {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      overflow: hidden;
    }
    #curtain .band {
      position: absolute;
      left: -5vw;
      width: 110vw;
      background: var(--bc);
      border: 4px solid var(--ink);
      border-radius: 999px;
      transform: translateX(-105%);
      transition: transform 0.6s cubic-bezier(.7, 0, .25, 1);
    }
    #curtain.cover .band   { transform: translateX(0%); }
    #curtain.uncover .band { transform: translateX(105%); }

    #badge {
      position: absolute;
      left: 50%; top: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translate(-50%, -50%) scale(0);
      z-index: 2;
    }
    #badge svg { width: clamp(110px, 22vw, 190px); animation: spin 3s linear infinite; }
    #badge h2 {
      margin-top: .1em;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(2.6rem, 9vw, 5.5rem);
      color: #fff;
    }
    #badge.show { animation: badgePop .55s var(--bounce) forwards; }
    #badge.hide { animation: badgeOut .3s ease-in forwards; }

    @keyframes badgePop {
      0%   { transform: translate(-50%, -50%) scale(0) rotate(-20deg); }
      100% { transform: translate(-50%, -50%) scale(1) rotate(0); }
    }
    @keyframes badgeOut {
      0%   { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(0) rotate(20deg); }
    }

    /* Sparkles, Speech & Toast */
    .spark {
      position: fixed;
      width: 20px; height: 20px;
      margin: -10px 0 0 -10px;
      z-index: 95;
      pointer-events: none;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: spark .85s ease-out forwards;
    }
    @keyframes spark {
      0%   { transform: translate(0, 0) scale(0) rotate(0); opacity: 1; }
      25%  { transform: translate(calc(var(--tx) * .5), calc(var(--ty) * .5)) scale(var(--s, 1)) rotate(calc(var(--r) * .4)); opacity: 1; }
      100% { transform: translate(var(--tx), calc(var(--ty) + 40px)) scale(0) rotate(var(--r)); opacity: 0; }
    }

    .say {
      position: fixed;
      z-index: 110;
      pointer-events: none;
      transform: translate(-50%, -100%);
      font-family: var(--font-display);
      font-size: 1.4rem;
      white-space: nowrap;
      background: #fff;
      color: var(--ink);
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: .15em .7em .25em;
      box-shadow: 0 4px 0 var(--ink);
      animation: say 1.3s ease-out forwards;
    }
    @keyframes say {
      0%   { transform: translate(-50%, -60%) scale(0); opacity: 0; }
      15%  { transform: translate(-50%, -110%) scale(1.1); opacity: 1; }
      80%  { transform: translate(-50%, -150%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -190%) scale(1); opacity: 0; }
    }

    #toast {
      position: fixed;
      left: 0; top: 0;
      z-index: 120;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      background: var(--yellow);
      color: var(--ink);
      border: 3.5px solid var(--ink);
      border-radius: 22px;
      padding: .35em .95em .4em;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform .32s var(--bounce), opacity .2s ease;
      pointer-events: none;
      text-align: center;
      max-width: min(320px, 88vw);
      line-height: 1.2;
    }
    #toast.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    @media (max-width: 780px) {
      :root { --nav-h: 58px; }
      .nav { top: 6px; left: 6px; right: 6px; height: var(--nav-h); padding: 0 8px; gap: 6px; border-radius: 16px; }
      .nav-right { min-width: 0; max-width: calc(100% - 44px); gap: 4px; }
      .mode-label { display: none; }
      .btn-mode, .btn-small { padding: 7px 10px; }
      .nav-link { font-size: 0.9rem; padding: 6px 8px; }
      .mode-switch-group { gap: 4px; }
      .content { padding-left: 16px; padding-right: 16px; }
    }

    @media (max-width: 560px) {
      .nav { padding: 0 10px; gap: 3px; }
      .logo-text { display: none; }
      .logo-icon { font-size: 1.75rem; }
      .nav-link { font-size: 0.8rem; padding: 5px 7px; }
      .icon-btn { width: 36px; height: 36px; font-size: 1rem; }
      .btn-mode, .btn-small { padding: 6px 7px; font-size: 0.84rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    }
  </style>
</head>

(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const qs = (sel, root = document) => root.querySelector(sel);

  const COLORS = ['#ff5fa2', '#ffd400', '#33b5ff', '#2fc46b', '#ff8a00', '#7c4dff'];

  function store(k, v) {
    try {
      if (v === undefined) {
        const x = localStorage.getItem(k);
        return x ? JSON.parse(x) : null;
      }
      localStorage.setItem(k, JSON.stringify(v));
    } catch (e) {

    }
  }

  // ---------- Sound (Web Audio Synthesizer matching index.html) ----------
  const Sound = {
    ctx: null,
    on: store('cc-sound') !== false,
    ensure() {
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return true;
      } catch (e) {
        return false;
      }
    },
    tone(f1, f2, dur, type = 'sine', vol = 0.15, delay = 0) {
      if (!this.on || !this.ensure()) return;
      try {
        const c = this.ctx, t = c.currentTime + delay;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f1, t);
        o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(c.destination);
        o.start(t);
        o.stop(t + dur + 0.05);
      } catch (e) {}
    },
    boing()      { this.tone(220, 520, 0.18, 'sine', 0.2); this.tone(520, 260, 0.2, 'sine', 0.15, 0.16); },
    pop()        { this.tone(700, 180, 0.12, 'triangle', 0.22); },
    hi()         { this.tone(500, 900, 0.12, 'triangle', 0.15); },
    clank()      { this.tone(180, 95, 0.14, 'square', 0.18); this.tone(420, 310, 0.12, 'triangle', 0.16, 0.08); },
    crash()      { this.tone(240, 75, 0.38, 'sawtooth', 0.18); },
    fanfare()    { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f * 1.002, 0.2, 'triangle', 0.18, i * 0.1)); },
    dayChime()   { [440, 554, 659, 880].forEach((f, i) => this.tone(f, f * 1.02, 0.22, 'sine', 0.14, i * 0.11)); },
    nightChime() { [880, 659, 554, 440].forEach((f, i) => this.tone(f, f * 0.98, 0.26, 'sine', 0.14, i * 0.12)); },
    whoosh() {
      if (!this.on || !this.ensure()) return;
      try {
        const c = this.ctx, t = c.currentTime, len = 0.7;
        const buf = c.createBuffer(1, c.sampleRate * len, c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const src = c.createBufferSource();
        src.buffer = buf;
        const f = c.createBiquadFilter();
        f.type = 'bandpass';
        f.Q.value = 1.2;
        f.frequency.setValueAtTime(300, t);
        f.frequency.exponentialRampToValueAtTime(3200, t + len);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.25);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        src.connect(f).connect(g).connect(c.destination);
        src.start(t);
      } catch (e) {}
    }
  };

      const d = rand(50, 140);
      s.className = 'spark';
      s.style.cssText =

        '--r:' + rand(-360, 360) + 'deg;--s:' + rand(0.8, 1.5) + ';background:' + pickRand(COLORS);

  function showToastNear(e, el, msg) {
    const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2, top: innerHeight / 2, width: 0, height: 0, bottom: innerHeight / 2 };
    const rawX = (e && e.clientX) ? e.clientX : (r.left + r.width / 2);
    const rawY = (e && e.clientY) ? e.clientY : (r.top + r.height / 2);

    const offsetY = rawY < 130 ? (r.bottom + 36) : (rawY - 48);
    const clampedX = Math.min(Math.max(rawX, 165), innerWidth - 165);
    const clampedY = Math.min(Math.max(offsetY, 60), innerHeight - 60);

    toast.textContent = msg;
    toast.style.left = clampedX + 'px';
    toast.style.top = clampedY + 'px';

  // Day Mode <-> Night Mode Switcher
  const dayModeBtn = $('dayModeBtn');

  function setTimeOfDay(mode, silent = false) {
    const isNight = mode === 'night';
    const currentlyNight = document.body.classList.contains('night-mode');
    if (isNight === currentlyNight && !silent) return;

    if (!silent) {
      document.body.classList.add('twilight-flash');
      setTimeout(() => document.body.classList.remove('twilight-flash'), 850);
    }

    if (isNight) {
      document.body.classList.add('night-mode');
      nightModeBtn.classList.add('active-mode');
      nightModeBtn.setAttribute('aria-pressed', 'true');
      dayModeBtn.classList.remove('active-mode');
      dayModeBtn.setAttribute('aria-pressed', 'false');
      if (!silent) {
        Sound.nightChime();
        burst(...centerOf(nightModeBtn), 10);
      }
    } else {
      document.body.classList.remove('night-mode');
      dayModeBtn.classList.add('active-mode');
      dayModeBtn.setAttribute('aria-pressed', 'true');
      nightModeBtn.classList.remove('active-mode');
      nightModeBtn.setAttribute('aria-pressed', 'false');
      if (!silent) {
        Sound.dayChime();
        burst(...centerOf(dayModeBtn), 10);
      }

    store('cc-theme', isNight ? 'night' : 'day');
  }

  async function switchView(target, triggerEl, labelText = "Let's play!") {
    if (busy || target === current || !pages[target]) return;
    busy = true;
    const from = pages[current];
    const to = pages[target];

    try {
      Sound.ensure();
      Sound.whoosh();
      if (triggerEl) burst(...centerOf(triggerEl), 14);

      curtain.style.pointerEvents = 'auto';
      scatterPage(from);
      from.classList.add('leaving');
      await wait(450);

      badgeText.textContent = labelText;
      curtain.classList.remove('uncover');
      curtain.classList.add('cover');
      await wait(550);

      badge.classList.remove('hide');
      badge.classList.add('show');
      Sound.fanfare();

      from.classList.remove('active', 'leaving', 'enter');
      to.classList.add('active');
      current = target;
      const sc = qs('.content', to);
      if (sc) sc.scrollTop = 0;
      await wait(650);

      badge.classList.remove('show');
      badge.classList.add('hide');
      await wait(200);

      curtain.classList.remove('cover');
      curtain.classList.add('uncover');
      to.classList.add('enter');

      qsa('.band', curtain).forEach((b) => (b.style.transition = 'none'));

      void curtain.offsetWidth;

  /* ---------- Interactive Game Engine ---------- */
  let G, S, timer = 0;
  const H = (v) => [...String(v)].reduce((s, c) => s + c.charCodeAt(0) * 47, 0) % 360;
  const esc = (s) => s.replace(/</g, '&lt;');

  const rs = (n, m) => (S) => { S.a = n ? Array(n).fill(null) : []; return m; };
  const ps = (v, m, f) => (S) => { f ? S.a.unshift(v) : S.a.push(v); S.hot = f ? 0 : S.a.length - 1; return m; };
  const rm = (f, m, e) => (S) => {
    if (!S.a.length) { S.err = 1; return e; }
    S.ret = f ? S.a.shift() : S.a.pop();
    return m.replace('#', S.ret);
  };
  const pk = (f, m, e) => (S) => {
    if (!S.a.length) { S.err = 1; return e; }
    S.hot = f ? 0 : S.a.length - 1;
    S.ret = S.a[S.hot];
    return m.replace('#', S.ret);
  };
  const sz = (S) => { S.ret = S.a.length; return 'size() only reports the count: ' + S.ret; };
  const st = (i, v, m) => (S) => { S.a[i] = v; S.hot = i; return m; };
  const rd = (i) => (S) => { S.hot = i; S.ret = S.a[i]; return 'Jump straight to slot ' + i + ' — no searching needed. That’s O(1)!'; };

  function seq(S, m) {
    const a = S.a;
    const hc = (i) => (i == S.hot ? ' hot stage-pop' : '');
    if (m == 'arr') {
      return '<div class="row">' + a.map((v, i) => '<div class="cell' + hc(i) + '"><b>' + (v == null ? '' : v) + '</b><u>' + i + '</u></div>').join('') + '</div>';

    if (!a.length) return '<div class="empty">⚠ empty — nothing here yet</div>';
    if (m == 'stack') {
      return '<div class="col">' + a.map((v, i) => '<div class="bk' + hc(i) + '" style="--h:' + H(v) + '">📖 ' + v + (i == a.length - 1 ? '<em>◀ TOP</em>' : '') + '</div>').join('') + '</div>';

    if (m == 'queue') {

      intro: 'First in, first out: new people join at the BACK, the FRONT person is served first.',
      L: [
        ['queue<string> q;', rs(0, 'An empty line.')],
        ['q.push("Ann");', ps('Ann', 'Ann joins the back of the line.')],
        ['q.push("Ben");', ps('Ben', 'Ben joins behind Ann.')],
        ['q.push("Cara");', ps('Cara', 'Cara is now at the back.')],
        ['q.pop();', rm(1, 'pop() serves the FRONT person: # leaves with ice cream 🍦', 'Nobody in line to serve!')],
        ['cout << q.front();', pk(1, 'front() looks at # without serving them.', 'The line is empty!')],
        ['cout << q.back();', pk(0, 'back() looks at #, the newest arrival.', 'The line is empty!')]
      ]
    },
    list: {
      ...T('list'),
      t: 'Train Linked List',
      intro: 'Each cart only knows the NEXT cart. The head pointer finds the first one.',
      L: [
        ['Node* head = nullptr;', rs(0, 'No train yet: head points to nothing.')],
        ['list.push_front(7);', ps(7, 'New cart hooked on at the front; head moves to it. O(1).', 1)],
        ['list.push_front(2);', ps(2, 'Another cart at the front; its next points to the old head.', 1)],
        ['list.push_back(4);', ps(4, 'Walk to the last cart, then link a new one after it.')],
        ['list.push_back(9);', ps(9, 'Another cart joins the end; its next is nullptr.')],
        ['list.pop_front();', rm(1, 'head jumps to the next cart; cart # is deleted (no memory leak!).', 'Nothing to remove: head is nullptr.')],
        ['list.pop_back();', rm(0, 'Walk to the second-last cart, delete # and set next = nullptr. O(n).', 'Nothing to remove: head is nullptr.')]
      ]
    },
    arr: {
      m: 'arr',
      t: 'Egg-Carton Array',
      init: () => ({ a: Array(6).fill(null) }),
      draw: (S) => seq(S, 'arr'),
      intro: 'Fixed slots with numbered positions (indexes start at 0).',
      L: [
        ['int arr[6];', rs(6, 'Six empty slots, side by side in memory.')],
        ['arr[0] = 7;', st(0, 7, 'Wrote 7 into slot 0.')],
        ['arr[3] = 2;', st(3, 2, 'Wrote 2 into slot 3 directly by index.')],
        ['arr[5] = 9;', st(5, 9, 'Wrote 9 into the last slot.')],
        ['cout << arr[3];', rd(3)],
        ['arr[3] = 0;', st(3, 0, 'Overwrote slot 3. The old value is gone.')]
      ]
    },
    bs: {
      t: 'Guess My Number (Binary Search)',
      intro: 'Press Step: each line halves the search area. The array must be sorted!',
      L: [
        'int lo = 0, hi = n - 1;',
        'while (lo <= hi)',
        '{',
        '    int mid = (lo + hi) / 2;',
        '    if (a[mid] == t) return mid;',
        '    if (a[mid] < t) lo = mid + 1;',
        '    else hi = mid - 1;',
        '}',
        'return -1;'
      ],
      init: () => {
        const a = Array.from({ length: 11 }, (_, i) => i * 6 + 1 + Math.floor(Math.random() * 5));
        return { a, t: a[Math.floor(Math.random() * 11)], lo: 0, hi: 10, mid: -1 };
      },
      *gen(S) {
        const a = S.a, t = S.t;
        let lo = 0, hi = 10;
        yield [0, 'lo = 0, hi = 10: every slot is still possible.'];
        while (lo <= hi) {
          const m = (S.mid = (lo + hi) >> 1);
          yield [3, 'Check the middle: index ' + m + ' holds ' + a[m] + '.'];
          if (a[m] == t) {
            S.found = m;
            yield [4, '' + a[m] + ' = ' + t + ' → found at index ' + m + '! 🎉'];
            return;
          }
          yield [4, '' + a[m] + ' is not ' + t + '.'];
          if (a[m] < t) {
            lo = S.lo = m + 1;
            yield [5, a[m] + ' < ' + t + ': throw away the LEFT half.'];
          } else {
            hi = S.hi = m - 1;
            yield [6, a[m] + ' > ' + t + ': throw away the RIGHT half.'];
          }
        }
      },
      draw: (S) =>
        '<p class="tg">Looking for <b>' + S.t + '</b></p><div class="row" style="padding-top:20px">' +
        S.a.map((v, i) =>
          '<div class="cell' +
          (i < S.lo || i > S.hi ? ' dim' : '') +
          (i == S.mid ? ' hot' : '') +
          (i == S.found ? ' win' : '') +
          '"><b>' + v + '</b><u>' + i + '</u><em>' +
          (i == S.lo ? 'lo ' : '') +
          (i == S.mid ? 'mid ' : '') +
          (i == S.hi ? 'hi' : '') +
          '</em></div>'
        ).join('') +
        '</div>'
    },
    sort: {
      t: 'Bubble Sort Race',
      intro: 'Press Step: watch neighbours compare (yellow) and swap (red). Green bars are finished.',
      L: [
        'for (int i = 0; i < n - 1; i++)',
        '{',
        '    for (int j = 0; j < n - 1 - i; j++)',
        '    {',
        '        if (a[j] > a[j + 1])',
        '            swap(a[j], a[j + 1]);',
        '    }',
        '}'
      ],
      init: () => ({ a: Array.from({ length: 8 }, (_, i) => ({ v: 2 + Math.floor(Math.random() * 19), id: i })), j: -1, sorted: 8 }),
      *gen(S) {
        const a = S.a, n = a.length;
        for (let i = 0; i < n - 1; i++) {
          S.j = -1;
          yield [0, 'Pass ' + (i + 1) + ': the biggest remaining bar floats to the right.'];
          for (let j = 0; j < n - 1 - i; j++) {
            S.j = j;
            S.sw = 0;
            yield [4, 'Compare ' + a[j].v + ' and ' + a[j + 1].v + '.'];
            if (a[j].v > a[j + 1].v) {
              [a[j], a[j + 1]] = [a[j + 1], a[j]];
              S.sw = 1;
              yield [5, 'Wrong order → swap them!'];
            }
          }
          S.sw = 0;
          S.sorted = n - 1 - i;
        }
        S.sorted = 0;
        S.j = -1;
        yield [7, 'Sorted! 🏆'];
      },
      paint: (S) => {
        const g = $('gS');
        if (g.dataset.g != 'sort') {
          g.dataset.g = 'sort';
          g.innerHTML = '<div class="bars">' + S.a.map((o) => '<div class="bar" id="b' + o.id + '"><b>' + o.v + '</b></div>').join('') + '</div>';
        }
        S.a.forEach((o, i) => {
          const e = $('b' + o.id);
          e.style.left = i * 12.5 + '%';
          e.style.height = o.v * 4.5 + '%';
          e.className = 'bar' + (i >= S.sorted ? ' ok' : (i == S.j || i == S.j + 1) ? (S.sw ? ' sw' : ' cmp') : '');
        });
      }
    }
  };

  function play(x, triggerEl) {
    G = D[x.id];
    $('gT').innerHTML = G.t;
    const tg = G.gen ? 'div' : 'button';
    $('gC').innerHTML = G.L.map((l, i) => '<' + tg + ' class="ln" data-i="' + i + '">' + esc(G.gen ? l : l[0]) + '</' + tg + '>').join('');
    $('gCtl').innerHTML = G.gen
      ? '<button class="btn" id="b1">⏭ Step</button><button class="btn" id="b2">▶ Auto</button><button class="btn" id="b3">🎲 New data</button>'
      : '<button class="btn" id="b2">▶ Run all</button><button class="btn" id="b3">↺ Reset</button>';
    $('gC').onclick = (e) => {
      const b = e.target.closest('button.ln');
      if (b) {
        Sound.clank();
        run(+b.dataset.i);
      }
    };
    if (G.gen) $('b1').onclick = () => { Sound.pop(); step(); };
    $('b2').onclick = () => { Sound.pop(); auto(); };
    $('b3').onclick = () => { Sound.boing(); start(); };
    start();
    switchView('game', triggerEl, x.n + '!');
  }

  function start() {
    stop();
    $('gS').dataset.g = '';
    S = G.init();
    S.cur = -1;
    S.msg = G.intro;
    if (G.gen) S.it = G.gen(S);
    draw();
  }

  function run(i) {
    S.hot = -1;
    S.err = 0;
    S.ret = null;
    S.cur = i;
    S.msg = G.L[i][1](S);
    if (S.err) Sound.crash();
    draw();
  }

  function step() {
    const r = S.it.next();
    if (r.done) {
      S.cur = -1;
      S.msg = '✅ Finished! Press 🎲 New data to go again.';
      Sound.fanfare();
      draw();
      return 0;
    }
    S.cur = r.value[0];
    S.msg = r.value[1];
    draw();
    return 1;
  }

  function stop() {
    clearInterval(timer);
    timer = 0;
    const b = $('b2');
    if (b && G) b.textContent = G.gen ? '▶ Auto' : '▶ Run all';
  }

  function auto() {
    if (timer) {
      stop();
      return;
    }
    $('b2').textContent = '⏸ Pause';
    let k = 0;
    timer = setInterval(() => {
      if (G.gen) {
        if (!step()) stop();
      } else if (k >= G.L.length) {
        stop();
      } else {
        run(k++);
      }
    }, 950);
  }

  function draw() {
    const g = $('gS');
    if (G.paint) G.paint(S);
    else {
      g.dataset.g = '';
      g.innerHTML = G.draw(S);
    }
    g.classList.remove('shake');
    void g.offsetWidth;
    if (S.err) g.classList.add('shake');
    $('gM').textContent = S.msg;
    $('gR').textContent = S.ret != null ? 'Returned: ' + S.ret : '';
    qsa('#gC .ln').forEach((e, i) => e.classList.toggle('cur', i == S.cur));
  }

  $('back').addEventListener('click', (e) => {
    stop();
    switchView('arcade-home', e.currentTarget, 'DSA Arcade!');
  });

  render('all');
})();
</script>
</body>
</html>
